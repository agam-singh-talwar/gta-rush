<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA Rush: Woodbine to The International Centre</title>
<style>
:root{--ink:#fff;--glass:rgba(12,16,32,.55);--acc:#ffb347;box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b1020;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.pill{background:var(--glass);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 16px}
#street{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px))}
#street small,#spd small{display:block;font-size:11px;letter-spacing:.14em;opacity:.65;text-transform:uppercase}
#street b{font-size:22px;color:var(--acc)}
#street.flash{animation:fl .9s}
@keyframes fl{0%{transform:scale(1.12);background:rgba(255,179,71,.5)}100%{transform:none}}
#stats{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));text-align:right;min-width:150px}
#tm{font:700 24px ui-monospace,Menlo,monospace}
#rem{font-size:12px;opacity:.75;margin:2px 0 8px}
#bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5e62)}
#spd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;min-width:120px}
#sp{font:800 44px ui-monospace,Menlo,monospace}
#rb{height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin:8px 0 4px}
#rf{display:block;height:100%;width:0;background:#7ee08a}
#gr{font:700 18px ui-monospace,Menlo,monospace;color:var(--acc)}
#lim{position:absolute;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:#fff;color:#111;border:6px solid #d62828;display:none;align-items:center;justify-content:center;font:800 24px ui-monospace,Menlo,monospace}
#lim.over{background:#ffb3b3}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.18);opacity:0;transition:opacity .3s;font-weight:600;text-align:center;max-width:80vw}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,24,50,.55),rgba(5,8,20,.92));padding:20px}
.card{max-width:460px;text-align:center}
.card h1{margin:0 0 6px;font-size:34px;letter-spacing:-.02em}
.card h1 span{color:var(--acc)}
.card p{opacity:.8;line-height:1.5;margin:8px 0}
.route{font-size:13px;opacity:.9;margin:14px 0}
button{font:700 16px inherit;font-family:inherit;border:0;border-radius:999px;padding:13px 30px;background:linear-gradient(90deg,#ffb347,#ff5e62);color:#1a1020;cursor:pointer;margin-top:10px}
kbd{background:rgba(255,255,255,.14);border-radius:5px;padding:1px 7px;font-size:12px}
#tc{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:0 14px calc(18px + env(safe-area-inset-bottom,0px))}
#tc div{width:74px;height:74px;border-radius:50%;background:var(--glass);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:26px;user-select:none;touch-action:none}
</style></head><body>
<div id="hud">
 <div id="street" class="pill"><small>Now on</small><b id="st">Queens Plate Dr</b></div>
 <div id="stats" class="pill"><div id="tm">0:00.0</div><div id="rem"></div><div id="bar"><i id="fill"></i></div></div>
 <div id="spd" class="pill"><b id="sp">0</b><small>km/h</small><div id="rb"><i id="rf"></i></div><b id="gr">N</b></div>
 <div id="lim"></div>
 <div id="toast"></div>
</div>
<div id="tc"><div id="tl">◀</div><div id="tg">▲</div><div id="tb">■</div><div id="tr">▶</div></div>
<div id="ov"><div class="card" id="card"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ROUTE: Woodbine Casino to The International Centre. Street names are real.
// Waypoints are hand-placed approximations; swap in OSM geometry here later (lat, lng, street name).
function main(DATA){
const FALLBACK=[
[43.7172,-79.6002,'Queens Plate Dr'],[43.7154,-79.6046,'Queens Plate Dr'],
[43.7132,-79.6080,'Rexdale Blvd'],[43.7112,-79.6118,'Rexdale Blvd'],
[43.7092,-79.6170,'Derry Rd W'],[43.7074,-79.6242,'Derry Rd W'],
[43.7060,-79.6310,'Derry Rd W'],[43.7056,-79.6352,'Airport Rd'],
[43.7078,-79.6350,'Airport Rd'],[43.7122,-79.6336,'Airport Rd'],
[43.7164,-79.6320,'Airport Rd']];
const WP=DATA?DATA.points.map((p,i)=>[p[0],p[1],DATA.names[i]||'']):FALLBACK;
const lat0=WP[0][0],lng0=WP[0][1],kx=111320*Math.cos(lat0*Math.PI/180),kz=110540;
const V3=THREE.Vector3;
const W=WP.map(p=>new V3((p[1]-lng0)*kx,0,-(p[0]-lat0)*kz));
const curve=new THREE.CatmullRomCurve3(W,false,'centripetal');
const STEP=4,L=curve.getLength(),N=Math.floor(L/STEP),sp=curve.getSpacedPoints(N);
const T=[],NM=[];
function segName(p){let b=1e9,n='';for(let i=0;i<W.length-1;i++){const a=W[i],c=W[i+1],dx=c.x-a.x,dz=c.z-a.z;let t=((p.x-a.x)*dx+(p.z-a.z)*dz)/(dx*dx+dz*dz);t=Math.max(0,Math.min(1,t));const d=Math.hypot(a.x+dx*t-p.x,a.z+dz*t-p.z);if(d<b){b=d;n=WP[i][2]}}return n}
for(let i=0;i<=N;i++){const a=sp[Math.max(0,i-1)],c=sp[Math.min(N,i+1)];const v=new V3(c.x-a.x,0,c.z-a.z).normalize();T.push(v);NM.push(segName(sp[i]))}
function at(s,d){s=Math.max(0,Math.min(N*STEP-.01,s));const i=Math.floor(s/STEP),f=s/STEP-i,a=sp[i],b=sp[i+1],t=T[i];
 const x=a.x+(b.x-a.x)*f,z=a.z+(b.z-a.z)*f;return{x:x-t.z*d,z:z+t.x*d,h:Math.atan2(t.x,t.z)}}

// ---------- scene ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputEncoding=THREE.sRGBEncoding;
document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.5,1400);
(function(){const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#1d2a5c');gr.addColorStop(.45,'#8a4f8c');gr.addColorStop(.72,'#ff8a5c');gr.addColorStop(1,'#ffc47a');g.fillStyle=gr;g.fillRect(0,0,4,256);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t})();
scene.fog=new THREE.Fog(0xe69a78,70,520);
scene.add(new THREE.HemisphereLight(0xffc89a,0x2a2f4a,.9));
const sun=new THREE.DirectionalLight(0xffa86a,2.1);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:200});scene.add(sun,sun.target);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({color:0x35452f,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;scene.add(ground);

// road texture
const rc=document.createElement('canvas');rc.width=256;rc.height=256;const rg=rc.getContext('2d');
rg.fillStyle='#2b2d33';rg.fillRect(0,0,256,256);
for(let i=0;i<2500;i++){rg.fillStyle='rgba(255,255,255,'+Math.random()*.05+')';rg.fillRect(Math.random()*256,Math.random()*256,2,2)}
rg.fillStyle='#e8e8e8';rg.fillRect(8,0,4,256);rg.fillRect(244,0,4,256);
rg.fillStyle='#f2c230';rg.fillRect(122,0,3,256);rg.fillRect(131,0,3,256);
rg.fillStyle='#e8e8e8';for(let y=0;y<256;y+=64){rg.fillRect(62,y,3,36);rg.fillRect(191,y,3,36)}
const rt=new THREE.CanvasTexture(rc);rt.wrapS=rt.wrapT=THREE.RepeatWrapping;rt.anisotropy=8;rt.encoding=THREE.sRGBEncoding;
function ribbon(w,y,mat,vs){const pos=[],uv=[],idx=[];for(let i=0;i<=N;i++){const p=sp[i],t=T[i],rx=-t.z,rz=t.x;
 pos.push(p.x-rx*w,y,p.z-rz*w,p.x+rx*w,y,p.z+rz*w);uv.push(0,i*STEP/vs,1,i*STEP/vs);if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
 const m=new THREE.Mesh(g,mat);m.receiveShadow=true;scene.add(m)}
ribbon(11,.0,new THREE.MeshStandardMaterial({color:0x6b6e74,roughness:.95}),10);
ribbon(8,.03,new THREE.MeshStandardMaterial({map:rt,roughness:.85}),16);

// buildings, trees, lights
function nearRoad(x,z,min){for(let i=0;i<=N;i+=1){const p=sp[i];if(Math.abs(p.x-x)<min&&Math.abs(p.z-z)<min&&Math.hypot(p.x-x,p.z-z)<min)return true}return false}
const wc=document.createElement('canvas');wc.width=64;wc.height=128;const wg=wc.getContext('2d');wg.fillStyle='#fff';wg.fillRect(0,0,64,128);
for(let y=6;y<124;y+=12)for(let x=6;x<60;x+=12){wg.fillStyle=Math.random()<.4?'#ffd98a':'#7a86a8';wg.fillRect(x,y,6,7)}
const wt=new THREE.CanvasTexture(wc);wt.encoding=THREE.sRGBEncoding;
const bl=[],tr=[],ls=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=2;i<N;i+=5){for(const sd of[-1,1]){if(rnd()<.35)continue;const d=sd*(18+rnd()*34),a=at(i*STEP,d);if(nearRoad(a.x,a.z,16))continue;
 bl.push({x:a.x,z:a.z,w:10+rnd()*16,h:6+rnd()*(rnd()<.2?38:16),dp:10+rnd()*14,r:a.h,c:new THREE.Color().setHSL(.58+rnd()*.12,.12,.35+rnd()*.3)})}}
for(let i=1;i<N;i+=3){for(const sd of[-1,1]){if(rnd()<.45)continue;const a=at(i*STEP,sd*(12.5+rnd()*5));if(nearRoad(a.x,a.z,10.5))continue;tr.push({x:a.x,z:a.z,s:.8+rnd()*.9})}}
for(let i=3;i<N;i+=10)for(const sd of[-1,1])ls.push(at(i*STEP,sd*10));
const bm=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({map:wt,roughness:.8,emissive:0x2a2010,emissiveMap:wt,emissiveIntensity:.5}),bl.length),m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();
bl.forEach((b,i)=>{q.setFromEuler(e.set(0,b.r,0));m4.compose(new V3(b.x,b.h/2,b.z),q,new V3(b.w,b.h,b.dp));bm.setMatrixAt(i,m4);bm.setColorAt(i,b.c)});bm.castShadow=bm.receiveShadow=true;scene.add(bm);
const tm=new THREE.InstancedMesh(new THREE.ConeGeometry(2.2,7,7),new THREE.MeshStandardMaterial({color:0x2d5a3a,roughness:1}),tr.length);
tr.forEach((t,i)=>{m4.compose(new V3(t.x,3.5*t.s,t.z),new THREE.Quaternion(),new V3(t.s,t.s,t.s));tm.setMatrixAt(i,m4)});tm.castShadow=true;scene.add(tm);
const pm=new THREE.InstancedMesh(new THREE.CylinderGeometry(.1,.14,9,6),new THREE.MeshStandardMaterial({color:0x444a55}),ls.length),
 hm=new THREE.InstancedMesh(new THREE.BoxGeometry(1.6,.25,.5),new THREE.MeshBasicMaterial({color:0xffe2a0}),ls.length);
ls.forEach((l,i)=>{m4.compose(new V3(l.x,4.5,l.z),new THREE.Quaternion(),new V3(1,1,1));pm.setMatrixAt(i,m4);q.setFromEuler(e.set(0,l.h,0));m4.compose(new V3(l.x,9,l.z),q,new V3(1,1,1));hm.setMatrixAt(i,m4)});scene.add(pm,hm);

function sign(txt,sub,s,d){const c=document.createElement('canvas');c.width=512;c.height=160;const g=c.getContext('2d');g.fillStyle='#10162e';g.fillRect(0,0,512,160);g.strokeStyle='#ffb347';g.lineWidth=6;g.strokeRect(5,5,502,150);
 g.fillStyle='#fff';g.font='bold 46px system-ui,sans-serif';g.textAlign='center';g.fillText(txt,256,78);g.fillStyle='#ffb347';g.font='24px system-ui,sans-serif';g.fillText(sub,256,120);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const a=at(s,d),m=new THREE.Mesh(new THREE.PlaneGeometry(14,4.4),new THREE.MeshBasicMaterial({map:t}));
 m.position.set(a.x,8,a.z);m.rotation.y=a.h+Math.PI;scene.add(m);const p=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,8),new THREE.MeshStandardMaterial({color:0x333}));p.position.set(a.x,4,a.z);scene.add(p)}
sign('WOODBINE CASINO','555 Rexdale Blvd · START',30,-16);
sign('THE INTERNATIONAL CENTRE','6900 Airport Rd · FINISH',N*STEP-30,-16);

// ---------- OSM-driven props (speed limits, stop signs, traffic lights) ----------
const LIM=new Array(N+1).fill(0),sigs=[];
function pole(a,h){const p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,h,6),new THREE.MeshStandardMaterial({color:0x555b66}));p.position.set(a.x,h/2,a.z);scene.add(p)}
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function board(tex,w,h,a,y){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,transparent:true,alphaTest:.5}));m.position.set(a.x,y,a.z);m.rotation.y=a.h+Math.PI;scene.add(m)}
function limSign(v,s){const a=at(s,9.4);pole(a,2.6);board(ctex(128,160,g=>{g.fillStyle='#fff';g.fillRect(0,0,128,160);g.strokeStyle='#111';g.lineWidth=5;g.strokeRect(3,3,122,154);g.fillStyle='#111';g.textAlign='center';
 g.font='bold 20px system-ui,sans-serif';g.fillText('MAXIMUM',64,34);g.font='bold 64px system-ui,sans-serif';g.fillText(v,64,104);g.font='18px system-ui,sans-serif';g.fillText('km/h',64,136)}),1,1.25,a,2.9)}
function stopSign(s){const a=at(s,9.2);pole(a,2.5);board(ctex(128,128,g=>{g.beginPath();for(let i=0;i<8;i++){const t=Math.PI/8+i*Math.PI/4;g[i?'lineTo':'moveTo'](64+62*Math.cos(t),64+62*Math.sin(t))}g.closePath();g.fillStyle='#c4161c';g.fill();g.lineWidth=5;g.strokeStyle='#fff';g.stroke();
 g.fillStyle='#fff';g.font='bold 38px system-ui,sans-serif';g.textAlign='center';g.fillText('STOP',64,77)}),1.1,1.1,a,2.8)}
function signal(s){const a=at(s,9.2);pole(a,5);const mats=[0xff2a2a,0xffc020,0x30e070].map(c=>new THREE.MeshBasicMaterial({color:c})),g=new THREE.Group();
 g.add(new THREE.Mesh(new THREE.BoxGeometry(.5,1.5,.4),new THREE.MeshStandardMaterial({color:0x15171c})));
 mats.forEach((m,i)=>{const l=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),m);l.position.set(0,.5-i*.5,.22);g.add(l)});
 g.position.set(a.x,5.2,a.z);g.rotation.y=a.h+Math.PI;scene.add(g);sigs.push({m:mats,ph:Math.random()*16})}
if(DATA){
 const proj=(la,ln)=>({x:(ln-lng0)*kx,z:-(la-lat0)*kz});
 const near=(x,z)=>{let b=1e18,k=0;for(let i=0;i<=N;i++){const d=(sp[i].x-x)**2+(sp[i].z-z)**2;if(d<b){b=d;k=i}}return k};
 (DATA.limits||[]).forEach((v,j)=>{if(v){const p=proj(DATA.points[j][0],DATA.points[j][1]);LIM[near(p.x,p.z)]=v}});
 let last=0;for(let i=0;i<=N;i++){if(LIM[i])last=LIM[i];else LIM[i]=last}
 const first=LIM.find(v=>v)||0;for(let i=0;i<=N&&!LIM[i];i++)LIM[i]=first;
 let pv=0;for(let i=0;i<=N;i++){if(LIM[i]!==pv){pv=LIM[i];if(pv)limSign(pv,Math.max(4,i*STEP-4))}}
 const seen=[];(DATA.controls||[]).forEach(c=>{const p=proj(c.lat,c.lng),k=near(p.x,p.z);if(Math.hypot(sp[k].x-p.x,sp[k].z-p.z)>30||k<4)return;
  if(seen.some(q=>q.t===c.type&&Math.abs(q.k-k)<6))return;seen.push({k,t:c.type});(c.type==='stop'?stopSign:signal)(Math.max(2,k*STEP-8))});
}
// ---------- cars ----------
const glass=new THREE.MeshStandardMaterial({color:0x10141c,metalness:.9,roughness:.1});
const orange=new THREE.MeshBasicMaterial({color:0xffa000}),red=new THREE.MeshBasicMaterial({color:0xff2030}),wht=new THREE.MeshBasicMaterial({color:0xfff4d0});
function makeCar(col){const g=new THREE.Group(),paint=new THREE.MeshStandardMaterial({color:col,metalness:.65,roughness:.3});
 const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.62,4.3),paint);b.position.y=.62;const c=new THREE.Mesh(new THREE.BoxGeometry(1.52,.5,2.1),glass);c.position.set(0,1.15,-.25);
 b.castShadow=c.castShadow=true;g.add(b,c);
 const wg=new THREE.CylinderGeometry(.36,.36,.26,14),wm=new THREE.MeshStandardMaterial({color:0x111});
 for(const x of[-.95,.95])for(const z of[-1.4,1.4]){const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.36,z);g.add(w)}
 const add=(mat,x,z,w=.4)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.16,.06),mat);m.position.set(x,.75,z);g.add(m);return m};
 add(wht,.6,2.16);add(wht,-.6,2.16);add(red,.6,-2.16);add(red,-.6,-2.16);
 g.userData.L=[add(orange,.84,2.16,.16),add(orange,.84,-2.16,.16)];g.userData.Rr=[add(orange,-.84,2.16,.16),add(orange,-.84,-2.16,.16)];
 for(const m of[...g.userData.L,...g.userData.Rr])m.visible=false;return g}
const me=makeCar(0x18c0ff);scene.add(me);
const cols=[0xd9dde3,0xf4f4f4,0x25282d,0x7a1f2b,0x2c4f7c,0x9aa3ad,0xd9dde3,0xeeeeee];
const traffic=[];
for(let i=0;i<22;i++){const dir=i%4===3?-1:1,lanes=dir>0?[2,6]:[-2,-6],d=lanes[i%2];
 const t={m:makeCar(cols[i%cols.length]),s:140+i*(L-260)/22+Math.random()*30,d,td:d,dir,v:12+Math.random()*9,timer:3+Math.random()*6,sig:0,fake:false,blink:0};
 scene.add(t.m);traffic.push(t)}

// ---------- game ----------
const $=id=>document.getElementById(id),keys={};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyR')reset();if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
const touch={};if('ontouchstart' in window){$('tc').style.display='flex';for(const[k,id]of[['l','tl'],['r','tr'],['g','tg'],['b','tb']]){const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();touch[k]=1});el.addEventListener('touchend',()=>touch[k]=0);el.addEventListener('touchcancel',()=>touch[k]=0)}}
// ---------- drivetrain (tune the feel here) ----------
const CAR={mass:1450,wheelR:.33,final:5.0,gears:[3.8,2.3,1.6,1.2,.95,.82],idle:850,redline:6500,peakRpm:4400,peakTq:260,
 shiftTime:.55,traction:7.5,brake:11,handbrake:7,dragK:.39,roll:.15,engBrake:.5};
const G={gear:0,tgt:0,shiftT:0,rpm:CAR.idle,thr:0};
function drive(v,up,dn,hb,dt){const C=CAR;G.thr+=((up?1:0)-G.thr)*Math.min(1,dt*(up?4:7));
 if(G.shiftT>0){G.shiftT-=dt;if(G.shiftT<=0)G.gear=G.tgt}
 const ratio=C.gears[G.gear]*C.final,wrpm=Math.max(0,v)*60/(2*Math.PI*C.wheelR)*ratio;
 const eng=Math.max(C.idle,wrpm,G.gear===0?1500+G.thr*1800:0);let a=0;
 if(dn&&v<.5){a=v>-6?-3.2:0}
 else if(up&&G.shiftT<=0&&v>-.5){const tq=C.peakTq*Math.max(0,1-Math.pow((eng-C.peakRpm)/3800,2))*G.thr*(eng>=C.redline?0:1);a=Math.min(C.traction,tq*ratio*.9/C.wheelR/C.mass)}
 if(v>.3){a-=C.dragK*v*v/C.mass+C.roll+(up?0:C.engBrake+wrpm*.0004);if(dn)a-=C.brake;if(hb)a-=C.handbrake}
